<!DOCTYPE html>
<html lang="ru">
<head>

<title>КРМК</title>
<style>
:root{--bg:#0e1116;--fg:#fff}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#0e1116}}
:root[data-theme="dark"]{--bg:#0e1116}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;touch-action:none;overscroll-behavior:none}
#gl{position:fixed;left:0;top:0;width:100%;height:100%;display:block}
.zone{position:fixed;top:0;bottom:0;z-index:2;touch-action:none}
#zl{left:0;width:50%}
#zr{right:0;width:50%}
#mm{position:fixed;left:calc(12px + env(safe-area-inset-left,0px));top:calc(12px + env(safe-area-inset-top,0px));width:124px;height:124px;border-radius:50%;z-index:3;pointer-events:none;border:2px solid rgba(255,255,255,.65);box-shadow:0 2px 12px rgba(0,0,0,.45)}
#joy{position:fixed;left:calc(30px + env(safe-area-inset-left,0px));bottom:calc(36px + env(safe-area-inset-bottom,0px));width:132px;height:132px;border-radius:50%;background:rgba(255,255,255,.14);border:2px solid rgba(255,255,255,.5);z-index:3;pointer-events:none}
#knob{position:absolute;left:35px;top:35px;width:58px;height:58px;border-radius:50%;background:rgba(255,255,255,.6);box-shadow:0 2px 8px rgba(0,0,0,.4)}
#gauge{display:none;position:fixed;left:50%;bottom:calc(8px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);width:150px;height:150px;z-index:3;pointer-events:none}
#sp{width:150px;height:150px;display:block}
.sig{position:absolute;top:50%;margin-top:-20px;font-size:34px;line-height:40px;color:rgba(255,255,255,.18);transition:none}
#sigL{left:-40px}
#sigR{right:-40px}
.sig.on{color:#3dff5a;text-shadow:0 0 12px #3dff5a}
#btns{position:fixed;right:calc(16px + env(safe-area-inset-right,0px));bottom:calc(22px + env(safe-area-inset-bottom,0px));z-index:4;display:flex;flex-direction:column;align-items:flex-end;gap:12px}
#sigrow{display:none;gap:12px}
.b{display:flex;align-items:center;justify-content:center;border-radius:50%;background:rgba(18,22,30,.58);border:2px solid rgba(255,255,255,.6);color:#fff;font-weight:700;touch-action:none;cursor:pointer}
.b:active,.b.press{background:rgba(255,255,255,.35)}
#bJump{width:82px;height:82px;font-size:15px}
#bSit{min-width:104px;height:54px;border-radius:27px;padding:0 16px;font-size:16px;visibility:hidden}
#bSit.show{visibility:visible}
.bs{width:54px;height:54px;font-size:26px}
.bs.act{opacity:1}
.bs.lit{background:rgba(60,220,90,.55);border-color:#3dff5a}
#loading{position:fixed;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;background:var(--bg);font-size:20px;letter-spacing:.04em}

#hud{position:fixed;right:calc(12px + env(safe-area-inset-right,0px));top:calc(12px + env(safe-area-inset-top,0px));z-index:5;text-align:right;pointer-events:none;text-shadow:0 1px 4px #000}
#money{font-size:20px;font-weight:800;color:#8dff9a}
#lvl{font-size:12px;opacity:.9}
#topbtns{position:fixed;right:calc(12px + env(safe-area-inset-right,0px));top:calc(64px + env(safe-area-inset-top,0px));z-index:6;display:flex;gap:8px}
.tb{width:46px;height:46px;border-radius:14px;background:rgba(18,22,30,.6);border:2px solid rgba(255,255,255,.55);display:flex;align-items:center;justify-content:center;font-size:22px;touch-action:none}
#jobline,#wpline{position:fixed;left:50%;transform:translateX(-50%);z-index:5;max-width:44vw;text-align:center;font-size:13px;font-weight:700;background:rgba(10,14,20,.6);padding:5px 10px;border-radius:12px;pointer-events:none;display:none}
#jobline{top:calc(10px + env(safe-area-inset-top,0px))}
#wpline{top:calc(48px + env(safe-area-inset-top,0px));color:#ffe14a;font-size:12px}
#chat{position:fixed;left:calc(12px + env(safe-area-inset-left,0px));top:calc(146px + env(safe-area-inset-top,0px));width:min(46vw,300px);z-index:5;pointer-events:none;font-size:12.5px;line-height:1.3;text-shadow:0 1px 3px #000}
.cl.sys{color:#ffe08a}.cl.me{color:#d9a8ff}.cl.do{color:#8fd0ff}.cl.ooc{color:#b0b0b0}.cl.ad{color:#7dffa0}
#toast{position:fixed;left:50%;top:36%;transform:translateX(-50%);z-index:40;background:rgba(10,14,20,.85);padding:10px 16px;border-radius:14px;font-weight:700;font-size:15px;opacity:0;pointer-events:none;transition:opacity .25s;max-width:80vw;text-align:center}
#panel{position:fixed;left:0;top:0;right:0;bottom:0;z-index:20;background:rgba(0,0,0,.55);display:none;align-items:center;justify-content:center;padding:calc(10px + env(safe-area-inset-top,0px)) 10px calc(10px + env(safe-area-inset-bottom,0px))}
#pbox{width:min(560px,100%);max-height:100%;display:flex;flex-direction:column;background:#151a22;border:2px solid rgba(255,255,255,.25);border-radius:18px;overflow:hidden}
#phead{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;font-weight:800;font-size:18px;background:#1e2632}
#pclose{width:36px;height:36px;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.12);border-radius:10px;cursor:pointer}
#pbody{padding:12px;overflow-y:auto;touch-action:pan-y;-webkit-user-select:auto;user-select:auto}

.grid,.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}.grid .pb{margin:0}.grid2 .pb{margin:6px 0}
.chrow{display:flex;gap:8px;margin:8px 0}.chrow .pb{margin:0;flex:1}
input[type=text],input[type=number]{width:100%;padding:12px;border-radius:10px;border:2px solid rgba(255,255,255,.3);background:#0f141b;color:#fff;font-size:16px;margin:6px 0;-webkit-user-select:text;user-select:text;touch-action:manipulation;font-family:inherit}
.chlog{height:40vh;overflow-y:auto;background:#0f141b;border-radius:10px;padding:8px;font-size:14px}

.list{margin-top:10px}
#bigmap{width:100%;max-width:340px;display:block;margin:0 auto;border-radius:10px}
.bar{position:relative;height:16px;background:#0f141b;border-radius:8px;margin:4px 0;overflow:hidden}.bar i{position:absolute;left:0;top:0;bottom:0;background:#3c8dff}.bar span{position:absolute;left:8px;top:0;font-size:11px;line-height:16px}

.reels{display:flex;gap:10px;justify-content:center;font-size:52px;margin:10px 0}.reels span{background:#0f141b;border-radius:12px;padding:8px 12px;min-width:74px;text-align:center}
.ball{width:100px;height:100px;border-radius:50%;margin:10px auto;color:#fff;font-size:44px;font-weight:800;display:flex;align-items:center;justify-content:center;border:4px solid #ffd54a}
.msg{text-align:center;font-weight:700;min-height:1.4em}
.mbar{position:relative;height:36px;background:#0f141b;border-radius:10px;margin:14px 0;overflow:hidden}.mbar .zone{position:absolute;top:0;bottom:0;background:rgba(60,220,90,.55)}.mbar .cur{position:absolute;top:0;bottom:0;width:6px;background:#ffd54a;margin-left:-3px}
.range{position:relative;height:260px;background:linear-gradient(#8fc0e8,#5d8a4a);border-radius:12px;overflow:hidden;touch-action:none}
.tgt{position:absolute;width:52px;height:52px;border-radius:50%;background:radial-gradient(#c4121c 0 25%,#fff 26% 50%,#c4121c 51% 75%,#fff 76%);border:2px solid #222}
#bAct{min-width:104px;height:54px;border-radius:27px;padding:0 16px;font-size:15px;visibility:hidden;background:rgba(31,122,58,.8)}

#menu{position:fixed;left:0;top:0;right:0;bottom:0;z-index:15;display:flex;align-items:center;justify-content:center;background:linear-gradient(rgba(6,10,18,.3),rgba(6,10,18,.78))}
.mbox{text-align:center;width:min(380px,90vw)}
.mbox h1{font-size:68px;letter-spacing:.12em;margin:0 0 2px;text-shadow:0 4px 18px #000}

body.inmenu #hud,body.inmenu #topbtns,body.inmenu #btns,body.inmenu #joy,body.inmenu #mm,body.inmenu #chat,body.inmenu #jobline,body.inmenu #wpline,body.inmenu #gauge{display:none!important}

.code{font-size:46px;font-weight:900;letter-spacing:.25em;color:#ffe14a;margin:6px 0}

<script>
__boot(function(){
const $=id=>document.getElementById(id);
if(!window.THREE){ $('loading').textContent='Не загрузился three.js'; return; }
window.addEventListener('error',function(e){ var l=$('loading'); l.style.display='flex'; l.style.padding='20px'; l.style.fontSize='14px'; l.textContent='Ошибка: '+e.message; });
const T=THREE;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const angDiff=(a,b)=>{let d=(b-a)%(Math.PI*2); if(d>Math.PI)d-=Math.PI*2; if(d<-Math.PI)d+=Math.PI*2; return d;};

/* ---------- renderer / scene ---------- */
const cv=$('gl');
const renderer=new T.WebGLRenderer({canvas:cv,antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2));
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=T.PCFSoftShadowMap;
const scene=new T.Scene();
scene.fog=new T.Fog(0xcfe6f5,70,270);
const camera=new T.PerspectiveCamera(62,1,0.1,520);
function resize(){ const w=window.innerWidth,h=window.innerHeight; renderer.setSize(w,h,false); camera.aspect=w/h; camera.updateProjectionMatrix(); }
window.addEventListener('resize',resize); window.addEventListener('orientationchange',()=>setTimeout(resize,200)); resize();
const maxAniso=Math.min(4,renderer.capabilities.getMaxAnisotropy());

scene.add(new T.HemisphereLight(0xdcecff,0x6d8a5c,0.6));
const sun=new T.DirectionalLight(0xfff3dc,1.05);
sun.castShadow=true; sun.shadow.mapSize.set(1024,1024);
{const sc=sun.shadow.camera; sc.left=-32;sc.right=32;sc.top=32;sc.bottom=-32;sc.near=1;sc.far=160;}
sun.shadow.bias=-0.0007;
scene.add(sun); scene.add(sun.target);

/* sky dome */
const skyG=new T.SphereGeometry(400,16,12);
{ const p=skyG.attributes.position, cols=[]; const top=new T.Color(0x3f86d6), hor=new T.Color(0xcfe6f5), c=new T.Color();
  for(let i=0;i<p.count;i++){ const y=p.getY(i)/400; c.copy(hor); if(y>0) c.lerp(top,Math.pow(clamp(y,0,1),0.6)); cols.push(c.r,c.g,c.b); }
  skyG.setAttribute('color',new T.Float32BufferAttribute(cols,3)); }
const sky=new T.Mesh(skyG,new T.MeshBasicMaterial({vertexColors:true,side:T.BackSide,fog:false,depthWrite:false}));
sky.frustumCulled=false; sky.renderOrder=-1; scene.add(sky);

let hasEnv=false;
try{
  const pm=new T.PMREMGenerator(renderer);
  const es=new T.Scene();
  es.add(new T.Mesh(skyG.clone(),new T.MeshBasicMaterial({vertexColors:true,side:T.BackSide})));
  const g=new T.Mesh(new T.CircleGeometry(390,24),new T.MeshBasicMaterial({color:0x6a8c55})); g.rotation.x=-Math.PI/2; g.position.y=-0.5; es.add(g);
  const s=new T.Mesh(new T.SphereGeometry(28,12,8),new T.MeshBasicMaterial({color:0xffffff})); s.position.set(200,300,140); es.add(s);
  scene.environment=pm.fromScene(es,0.02).texture; pm.dispose(); hasEnv=true;
}catch(e){}

/* ---------- helpers ---------- */
const M=o=>new T.MeshStandardMaterial(o);
function add(p,geo,mat,x,y,z,rx,ry,rz){ const m=new T.Mesh(geo,mat); m.position.set(x||0,y||0,z||0); m.rotation.set(rx||0,ry||0,rz||0); m.castShadow=true; m.receiveShadow=true; p.add(m); return m; }
const bx=(p,w,h,d,mat,x,y,z,rx,ry,rz)=>add(p,new T.BoxGeometry(w,h,d),mat,x,y,z,rx,ry,rz);
const cy=(p,rt,rb,h,mat,x,y,z,rx,ry,rz,s)=>add(p,new T.CylinderGeometry(rt,rb,h,s||16),mat,x,y,z,rx,ry,rz);
const sph=(p,r,mat,x,y,z,sx,sy,sz)=>{const m=add(p,new T.SphereGeometry(r,14,10),mat,x,y,z); m.scale.set(sx||1,sy||1,sz||1); return m;};

function canvasTex(w,h,draw,rx,ry){
  const c=document.createElement('canvas'); c.width=w; c.height=h; draw(c.getContext('2d'),w,h);
  const t=new T.CanvasTexture(c); t.wrapS=t.wrapT=T.RepeatWrapping; t.repeat.set(rx||1,ry||1); t.anisotropy=maxAniso; return t;
}
function speckle(ctx,w,h,n,a,dark){ for(let i=0;i<n;i++){ const v=dark?Math.random()*90|0:150+Math.random()*105|0; ctx.fillStyle='rgba('+v+','+v+','+v+','+a+')'; ctx.fillRect(Math.random()*w,Math.random()*h,2,2);} }

/* merge static meshes of a group by material (fewer draw calls) */
function mergeChunk(g){
  g.updateMatrixWorld(true);
  const inv=new T.Matrix4().copy(g.matrixWorld).invert();
  const by=new Map();
  g.traverse(o=>{ if(o.isMesh){ let a=by.get(o.material); if(!a){a=[];by.set(o.material,a);} a.push(o); } });
  const out=[];
  by.forEach((meshes,mat)=>{
    let vc=0,ic=0;
    meshes.forEach(m=>{const pc=m.geometry.attributes.position.count; vc+=pc; ic+=m.geometry.index?m.geometry.index.count:pc;});
    const pos=new Float32Array(vc*3), nor=new Float32Array(vc*3), uv=new Float32Array(vc*2);
    const idx=vc>65535?new Uint32Array(ic):new Uint16Array(ic);
    let vo=0,io=0; const mtx=new T.Matrix4(), nm=new T.Matrix3(), v=new T.Vector3();
    meshes.forEach(m=>{
      const geo=m.geometry; mtx.multiplyMatrices(inv,m.matrixWorld); nm.getNormalMatrix(mtx);
      const p=geo.attributes.position, n=geo.attributes.normal, u=geo.attributes.uv;
      for(let i=0;i<p.count;i++){
        v.fromBufferAttribute(p,i).applyMatrix4(mtx); pos[(vo+i)*3]=v.x; pos[(vo+i)*3+1]=v.y; pos[(vo+i)*3+2]=v.z;
        v.fromBufferAttribute(n,i).applyMatrix3(nm).normalize(); nor[(vo+i)*3]=v.x; nor[(vo+i)*3+1]=v.y; nor[(vo+i)*3+2]=v.z;
        if(u){ uv[(vo+i)*2]=u.getX(i); uv[(vo+i)*2+1]=u.getY(i); }
      }
      if(geo.index){ for(let i=0;i<geo.index.count;i++) idx[io++]=geo.index.getX(i)+vo; }
      else { for(let i=0;i<p.count;i++) idx[io++]=vo+i; }
      vo+=p.count;
    });
    const bg=new T.BufferGeometry();
    bg.setAttribute('position',new T.BufferAttribute(pos,3)); bg.setAttribute('normal',new T.BufferAttribute(nor,3)); bg.setAttribute('uv',new T.BufferAttribute(uv,2));
    bg.setIndex(new T.BufferAttribute(idx,1));
    const me=new T.Mesh(bg,mat); me.castShadow=true; me.receiveShadow=true; out.push(me);
    meshes.forEach(m=>m.geometry.dispose());
  });
  while(g.children.length) g.remove(g.children[0]);
  out.forEach(m=>g.add(m));
}

/* colliders + view culling registry */
const boxes=[];
function hit(x,z,r,y){ for(let i=0;i<boxes.length;i++){ const b=boxes[i]; if(b.h!==undefined&&y!==undefined&&y>b.h-.05) continue; if(x>b.x0-r&&x<b.x1+r&&z>b.z0-r&&z<b.z1+r) return true; } return false; }
const culls=[];
function reg(g,dyn){
  g.updateMatrixWorld(true);
  const s=new T.Box3().setFromObject(g).getBoundingSphere(new T.Sphere());
  if(dyn) g.worldToLocal(s.center);
  const ent={g:g,c:s.center,r:s.radius,dyn:!!dyn,hide:false}; culls.push(ent); return ent;
}
const fr=new T.Frustum(), pmx=new T.Matrix4(), tmpS=new T.Sphere();
let CULL_FAR=300;
function cullPass(){
  camera.updateMatrixWorld();
  pmx.multiplyMatrices(camera.projectionMatrix,camera.matrixWorldInverse); fr.setFromProjectionMatrix(pmx);
  for(let i=0;i<culls.length;i++){
    const e=culls[i];
    if(e.dyn){ e.g.updateMatrixWorld(true); tmpS.center.copy(e.c); e.g.localToWorld(tmpS.center); } else tmpS.center.copy(e.c);
    tmpS.radius=e.r+2.5;
    e.g.visible=!e.hide&&tmpS.center.distanceTo(camera.position)-e.r<CULL_FAR&&fr.intersectsSphere(tmpS);
  }
}

/* window unit; origin on the wall surface, +Z outward */
function win(p,x,y,z,ry,w,h){
  const g=new T.Group(); g.position.set(x,y,z); g.rotation.y=ry||0; p.add(g);
  bx(g,w,h,.02,mGlass,0,0,.03);
  bx(g,w-.05,h-.05,.01,CURT[(Math.random()*CURT.length)|0],0,0,.017);
  const t=.07;
  bx(g,w+2*t,t,.1,mTrim,0,h/2+t/2,.05); bx(g,w+2*t,t,.1,mTrim,0,-h/2-t/2,.05);
  bx(g,t,h,.1,mTrim,-w/2-t/2,0,.05); bx(g,t,h,.1,mTrim,w/2+t/2,0,.05);
  bx(g,.04,h,.07,mTrim,0,0,.06);
  if(h>1.3) bx(g,w,.04,.07,mTrim,0,h*.15,.06);
  bx(g,w+.4,.06,.22,mTrim,0,-h/2-t-.03,.11);
  return g;
}

/* ---------- house (2 floors) ---------- */
function buildHouse(){
  const root=new T.Group(); root.position.set(-15,0,-20); scene.add(root);
  const W=11,D=9,H1=3.1,H2=2.9, Htop=H1+H2;
  const mWall=M({color:0xeadfc6,map:texPlaster,roughness:.95});

  const cg=new T.Group(), cu=new T.Group(), cr=new T.Group(), cf=new T.Group(); root.add(cg,cu,cr,cf);

  /* ground floor */
  bx(cg,W+.2,.5,D+.2,mStone,0,.25,0);

  [-3.6,3.6].forEach(x=>win(cg,x,1.9,D/2,0,1.3,1.5));

  [-2,2].forEach(z=>win(cg,-W/2,1.9,z,-Math.PI/2,1.1,1.5));
  win(cg,W/2,1.9,-1.8,Math.PI/2,1.1,1.5); win(cg,W/2,1.9,2.2,Math.PI/2,1.1,1.5);
  // steps, door
  bx(cg,2.6,.25,1.0,mStone,0,.125,D/2+.5); bx(cg,2.2,.25,.6,mStone,0,.375,D/2+.3);
  const dy=.5;
  bx(cg,1.3,.12,.16,mTrim,0,dy+2.2,D/2+.06); bx(cg,.12,2.2,.16,mTrim,-.62,dy+1.1,D/2+.06); bx(cg,.12,2.2,.16,mTrim,.62,dy+1.1,D/2+.06);
  bx(cg,1.1,2.1,.08,mWood,0,dy+1.05,D/2+.05);
  bx(cg,.4,.7,.03,mWoodL,-.25,dy+.45,D/2+.1); bx(cg,.4,.7,.03,mWoodL,.25,dy+.45,D/2+.1);
  bx(cg,.4,.5,.03,mWoodL,-.25,dy+1.2,D/2+.1); bx(cg,.4,.5,.03,mWoodL,.25,dy+1.2,D/2+.1);
  bx(cg,.8,.35,.02,mGlass,0,dy+1.75,D/2+.1);
  cy(cg,.028,.028,.14,mChromeS,.4,dy+1.05,D/2+.14,Math.PI/2); sph(cg,.05,mChromeS,.4,dy+1.05,D/2+.21);
  bx(cg,.3,.3,.03,new T.MeshStandardMaterial({map:texNum}),1.15,dy+1.5,D/2+.02);

  [-1.25,1.25].forEach(x=>cy(cg,.06,.06,2.45,mTrim,x,1.73,D/2+1.35,0,0,0,10));
  sph(cg,.11,mLamp,-1.0,dy+2.05,D/2+.12); sph(cg,.11,mLamp,1.0,dy+2.05,D/2+.12);
  cy(cg,.05,.05,H1,mChromeS,W/2-.15,H1/2,D/2+.1,0,0,0,8);

  /* upper floor */
  bx(cu,W+.3,.18,D+.3,mTrim,0,H1+.09,0);

  [-3.9,3.9].forEach(x=>win(cu,x,H1+1.55,D/2,0,1.3,1.5));

  // balcony + door
  win(cu,0,H1+1.3,D/2,0,1.1,2.1);
  bx(cu,3.4,.16,1.3,mConc,0,H1+.26,D/2+.65);
  const ry0=H1+.34;
  for(let i=0;i<=8;i++){ bx(cu,.04,.95,.04,mDarkM,-1.6+i*.4,ry0+.475,D/2+1.25); }
  for(let i=0;i<3;i++){ const zz=D/2+.35+i*.45; bx(cu,.04,.95,.04,mDarkM,-1.6,ry0+.475,zz); bx(cu,.04,.95,.04,mDarkM,1.6,ry0+.475,zz); }
  bx(cu,3.3,.06,.06,mChromeS,0,ry0+.95,D/2+1.25); bx(cu,.06,.06,1.0,mChromeS,-1.6,ry0+.95,D/2+.75); bx(cu,.06,.06,1.0,mChromeS,1.6,ry0+.95,D/2+.75);
  bx(cu,3.3,.04,.04,mDarkM,0,ry0+.5,D/2+1.25);

  /* gable roof */

  const gg=new T.ShapeGeometry(sh); gg.translate(0,Htop,0); gg.rotateY(-Math.PI/2);
  [-1,1].forEach(s=>add(cr,gg.clone(),mWallD,s*(W/2-.03),0,0));

  [-1,1].forEach(s=>{ [1,-1].forEach(t=>{ const m=bx(cr,.1,.16,sl+.1,mTrim,s*(W/2+.72),Htop+RH/2+.04,t*halfD/2); m.rotation.x=t*al; }); });
  // chimney

  cy(cr,.14,.14,.4,mDarkM,-3.2,Htop+3.6,-1.6,0,0,0,10); cy(cr,.14,.14,.4,mDarkM,-2.8,Htop+3.6,-1.6,0,0,0,10);
  // gable windows
  win(cr,W/2-.03,Htop+.85,0,Math.PI/2,.8,.9); win(cr,-W/2+.03,Htop+.85,0,-Math.PI/2,.8,.9);

  /* fence, path, gate */
  const fz=D/2+5.4;
  bx(cf,1.8,.05,fz-D/2-1.0,mConc,0,.025,(fz+D/2+1.0)/2);
  for(let side=0;side<2;side++){

    boxes.push({x0:root.position.x+x0,x1:root.position.x+x1,z0:root.position.z+fz-.12,z1:root.position.z+fz+.12});
  }
  [-1.3,1.3].forEach(x=>bx(cf,.2,1.3,.2,mDarkM,x,.65,fz));

  [cg,cu,cr,cf].forEach(mergeChunk);
  root.updateMatrixWorld(true);

  bx(cr,.4,.1,D+.4,mTrim,W/2+.03,Htot+1.2,0); bx(cr,.4,.1,D+.4,mTrim,-W/2-.03,Htot+1.2,0);

const vehicles=[];

function spawnVeh(model,color,x,z,h,o){

  const v={color:color,model:model,d:d,kind:kind,p:p,x:x,z:z,h:h,v:0,sa:0,pitch:0,roll:0,fuel:o.fuel!==undefined?o.fuel:(d.cap||60),braking:false,rev:false,siren:false,owner:o.owner||0,carId:o.carId||0,drive:o.drive!==false,trH:h,crashes:0,

    pts:kind==='army'?[-3,-1,1,3.2]:kind==='semi'?[-2.1,0,2.1]:kind==='moped'?[-.5,.5]:[-1.5*sc,0,1.5*sc],
    r:kind==='car'?1.0*sc:kind==='moped'?.6:1.45, camD:kind==='army'?13:kind==='semi'?17:kind==='moped'?5.5:8.4*sc, camH:kind==='car'?1.35*sc:kind==='moped'?1.4:3, enterR:kind==='car'?3.6:kind==='moped'?3:(kind==='army'?6:7), wr:p.wr*(kind==='car'?sc:1)};
  v.cull=reg(p.root,true); applyVeh(v,0); vehicles.push(v); return v;
}
function applyVeh(v,dt){
  const p=v.p; p.root.position.set(v.x,0,v.z); p.root.rotation.y=v.h;
  p.tilt.rotation.x=v.pitch; p.tilt.rotation.z=v.roll;
  for(let i=0;i<p.wheels.length;i++){ const w=p.wheels[i]; w.spin.rotation.x+=v.v*dt/v.wr; if(w.front) w.piv.rotation.y=v.sa; }
  if(p.sw) p.sw.rotation.z=-v.sa*3.2;
  if(p.swY) p.swY.rotation.y=v.sa;
  if(p.trailer) p.trailer.rotation.y=v.trH-v.h;
}

  p.mSigL.emissiveIntensity=(lit&&sigState===1)?2.6:0; p.mSigR.emissiveIntensity=(lit&&sigState===-1)?2.6:0;
  p.mTail.emissiveIntensity=(active&&v.braking)?2.4:.5; p.mRev.emissiveIntensity=(active&&v.rev)?2:0;
  if(p.mR){ const f=active&&v.siren, ph=Math.floor(tAll*8)%2; p.mR.emissiveIntensity=f?(ph?3:.2):.3; p.mB.emissiveIntensity=f?(ph?.2:3):.3; }
}
function vehPts(v){ const a=[]; const sx=Math.sin(v.h), cz=Math.cos(v.h); for(let i=0;i<v.pts.length;i++){ a.push([v.x+sx*v.pts[i],v.z+cz*v.pts[i]]); } if(v.kind==='semi'){ const hx=v.x-sx*1.4, hz=v.z-cz*1.4, ts=Math.sin(v.trH), tc=Math.cos(v.trH); [3.5,7,10.5].forEach(d=>a.push([hx-ts*d,hz-tc*d])); } return a; }
function vehHit(v,pts){
  for(let k=0;k<vehicles.length;k++){ const o=vehicles[k]; if(o===v) continue; if(Math.abs(o.x-v.x)>18||Math.abs(o.z-v.z)>18) continue;
    const op=vehPts(o); for(let i=0;i<pts.length;i++) for(let j=0;j<op.length;j++){ if(Math.hypot(pts[i][0]-op[j][0],pts[i][1]-op[j][1])<v.r+o.r-.2) return true; } }
  return false;
}
function vehBlock(x,z,r,skip){
  for(let k=0;k<vehicles.length;k++){ const o=vehicles[k]; if(o===skip) continue; if(Math.abs(o.x-x)>10||Math.abs(o.z-z)>10) continue;
    const op=vehPts(o); for(let j=0;j<op.length;j++){ if(Math.hypot(x-op[j][0],z-op[j][1])<o.r+r-.1) return true; } }
  return false;

function updateNPCs(dt,px,pz){

    const n=npcs[i]; const far=Math.hypot(n.x-px,n.z-pz)>110; n.cull.hide=far; if(far) continue;
    const t=n.route[n.i]; const dx=t[0]-n.x, dz=t[1]-n.z, d=Math.hypot(dx,dz);
    if(d<.6){ n.i=(n.i+1)%4; } else { n.x+=dx/d*n.spd*dt; n.z+=dz/d*n.spd*dt; n.h+=angDiff(n.h,Math.atan2(dx,dz))*(1-Math.exp(-6*dt)); }

const reserved=[];
function reserve(x0,x1,z0,z1){ reserved.push({x0:x0,x1:x1,z0:z0,z1:z1}); }
function isReserved(x0,x1,z0,z1){ for(const r of reserved){ if(x1>r.x0-3&&x0<r.x1+3&&z1>r.z0-3&&z0<r.z1+3) return true; } return false; }
const noFill={};  // 'i,j'
function fillCity(){
  for(let i=0;i<4;i++) for(let j=0;j<4;j++){
    if(noFill[i+','+j]) continue;
    const c=new T.Group(); scene.add(c);
    const bx0=RX[i]+9, bz0=RZ[j]+9;
    for(let a=0;a<3;a++) for(let b=0;b<3;b++){
      const cx=bx0+18.5+a*37, cz=bz0+18.5+b*37;
      const w=rnd(17,27), d=rnd(17,27);
      if(isReserved(cx-w/2,cx+w/2,cz-d/2,cz+d/2)) continue;
      if(srnd()<.14) continue;
      genBuilding(c,cx,cz,w,d,3*Math.round(rnd(3,10)),(srnd()*4)|0);
    }
    finish(c,[c]);
  }
}

const BOTS=['Артём_Волков','Максим_Лебедев','Дарья_Соколова','Иван_Морозов','Кирилл_Орлов','Анна_Ким','Денис_Громов','Sergey_Black','Ольга_Белова','Тимур_Хасанов'];
const BOT_LINES=['кто на шахту? там золото попадается','продам Тигр срочно, недорого','в казино сегодня прёт','где ближайшая заправка?','на дальнобое хорошо платят','в Лероруб набирают грузчиков','в армии полоса препятствий жёсткая, через стены прыгать надо','полиция, у центра нарушитель бегает','кто в автосалон?','аренда мопеда всего 50 рублей','/me осматривает машину','куплю Молнию','паспорт получили? идите в администрацию','бензин дорогой, 55 за литр','всем привет!','кто на стрельбище?'];
function botReply(t){
  if(MP.on) return;
  const s=t.toLowerCase(); let r=null;
  if(/прив|здаров|хай/.test(s)) r=pick(['привет!','здарова','о, привет']);
  else if(/работ|шахт|груз|армия|полици/.test(s)) r=pick(['на шахте золото падает, но надо в тайминг попадать','в армии платят нормально, но звание долго растёт','дальнобой лучший, но нужен 3 уровень','полиция с 4 уровня']);
  else if(/куп|прод|маш|авто/.test(s)) r=pick(['в автосалоне Молния огонь','Кабан для бездорожья норм','копи на Тигр']);
  else if(/казин|слот|рулет/.test(s)) r=pick(['не ставь всё сразу)','я вчера проиграл всё, теперь на шахте','зеро — это 36 к 1']);
  else if(/деньг|бан|атм/.test(s)) r=pick(['клади в банкомат, а то потеряешь','банкомат у администрации']);
  else if(Math.random()<.45) r=pick(['ага','понятно','+','😄','ну да']);
  if(r) setTimeout(()=>chat(pick(BOTS),r),rnd(1200,3200));
}
function sendChat(t){
  t=t.trim(); if(!t) return; const nm=MP.on&&MP.name?MP.name:myName();
  if(t[0]==='/'){
    const sp=t.indexOf(' '), cmd=(sp<0?t:t.slice(0,sp)).toLowerCase(), rest=sp<0?'':t.slice(sp+1);
    if(cmd==='/me') chatOut('','* '+nm+' '+rest,'me');
    else if(cmd==='/do') chatOut('','* '+rest+' ('+nm+')','do');
    else if(cmd==='/try') chatOut('','* '+nm+' '+rest+' ['+(Math.random()<.5?'Удачно':'Неудачно')+']','me');
    else if(cmd==='/b') chatOut('','(( '+nm+': '+rest+' ))','ooc');
    else if(cmd==='/ad'){ if(!rest) return; if(spend(200)) chatOut('Объявление',rest+' — '+nm,'ad'); }
    else if(cmd==='/time'){ chat('',new Date().toLocaleTimeString('ru-RU'),'sys'); }
    else if(cmd==='/id'){ chat('',MP.on?('Ваш ID: '+MP.id):'ID есть только в мультиплеере','sys'); }
    else if(cmd==='/players'){ if(!MP.on){ chat('','Вы играете одни','sys'); } else { chat('','ID '+MP.id+' — '+MP.name+' (вы)','sys'); Object.keys(MP.players).forEach(k=>chat('','ID '+MP.players[k].id+' — '+MP.players[k].name,'sys')); } }
    else if(cmd==='/pay'){
      if(!MP.on){ sys('/pay работает только в мультиплеере'); return; }
      const a=rest.trim().split(/\s+/), id=parseInt(a[0]), amt=Math.floor(+a[1]);
      if(!(id>0)||!(amt>0)){ sys('Использование: /pay ID сумма'); return; }
      if(id===MP.id){ sys('Нельзя платить самому себе'); return; }
      if(!MP.players[id]){ sys('Игрока с ID '+id+' нет в комнате'); return; }
      if(S.cash<amt){ sys('Не хватает наличных'); return; }
      S.cash-=amt; mpSend({t:'pay',to:id,from:MP.id,name:MP.name,amt:amt}); sys('Вы передали '+rub(amt)+' игроку '+MP.players[id].name+' [ID '+id+']'); save();
    }
    else chat('','Команды: /me /do /try /b /ad /time /id /players /pay ID сумма','sys');
    return;
  }
  chatOut(nm,t); botReply(t);
}

/* ---------- паспорт ---------- */
function openPassportOffice(){
  if(S.pass){ openPassport(); return; }
  let sex='М';
  showPanel('Паспортный стол','<div class="card"><p>Оформление паспорта (бесплатно). Без паспорта нельзя устроиться на работу и купить машину.</p><input id="pfn" type="text" maxlength="14" placeholder="Имя"><input id="pln" type="text" maxlength="16" placeholder="Фамилия"><div class="chrow">'+B('Мужской','sx','М','on')+B('Женский','sx','Ж')+'</div><input id="pag" type="number" min="18" max="70" value="25" placeholder="Возраст"></div>'+B('Оформить паспорт','ok','','green'),(a,v,b)=>{
    if(a==='sx'){ sex=v; pbody.querySelectorAll('[data-a=sx]').forEach(x=>x.classList.toggle('on',x===b)); }
    if(a==='ok'){
      const f=$q('#pfn').value.trim(), l=$q('#pln').value.trim(), age=clamp(parseInt($q('#pag').value)||25,18,70);
      if(f.length<2||l.length<2){ toast('Введите имя и фамилию'); return; }
      const cap=s=>s[0].toUpperCase()+s.slice(1).toLowerCase();
      S.pass={first:cap(f),last:cap(l),sex:sex,age:age,num:'45 '+(10+(Math.random()*89|0))+' '+(100000+(Math.random()*899999|0)),date:new Date().toLocaleDateString('ru-RU')};
      sys('Паспорт получен: '+S.pass.first+' '+S.pass.last); save(); openPassport();

  });
}
function openPassport(){
  const p=S.pass; if(!p) return;
  showPanel('Паспорт','<div class="pass"><div class="ph">'+(p.sex==='Ж'?'👩':'👨')+'</div><div><small>РОССИЙСКАЯ ФЕДЕРАЦИЯ</small><h3>'+esc(p.last)+'<br>'+esc(p.first)+'</h3><p>Пол: '+p.sex+' · Возраст: '+p.age+'</p><p>Серия/номер: <b>'+p.num+'</b></p><p>Выдан: '+p.date+'</p></div></div>',null);

/* ---------- банкомат ---------- */
function openATM(){
  const draw=()=>{
    showPanel('Банкомат','<div class="card"><p>Наличные: <b>'+rub(S.cash)+'</b></p><p>На счёте: <b>'+rub(S.bank)+'</b></p></div><input id="atm" type="number" min="1" placeholder="Сумма"><div class="grid2">'+B('Положить','in','','green')+B('Снять','out','','red')+'</div><div class="grid2">'+B('Всё положить','inall')+B('Всё снять','outall')+'</div>'+B('+1 000','q','1000')+B('+10 000','q','10000'),(a,v)=>{
      const inp=$q('#atm'); const amt=Math.floor(+inp.value)||0;
      if(a==='q'){ inp.value=(+inp.value||0)+ +v; return; }
      if(a==='in'||a==='inall'){ const n=a==='inall'?S.cash:amt; if(n<=0||n>S.cash){ toast('Неверная сумма'); return; } S.cash-=n; S.bank+=n; toast('Внесено '+rub(n)); save(); draw(); }
      if(a==='out'||a==='outall'){ const n=a==='outall'?S.bank:amt; if(n<=0||n>S.bank){ toast('Неверная сумма'); return; } S.bank-=n; S.cash+=n; toast('Снято '+rub(n)); save(); draw(); }
    });
  };
  draw();
}

/* ---------- карта ---------- */
function openMap(){
  const px=veh?veh.x:P.x, pz=veh?veh.z:P.z;
  const list=POIS.slice().sort((a,b)=>Math.hypot(a.x-px,a.z-pz)-Math.hypot(b.x-px,b.z-pz));
  let h='<canvas id="bigmap" width="340" height="340"></canvas><div class="list">';
  list.forEach((p,i)=>{ h+='<div class="row"><span>'+p.k+' '+p.n+' · '+Math.round(Math.hypot(p.x-px,p.z-pz))+' м</span>'+B('📍','wp',POIS.indexOf(p))+'</div>'; });
  h+='</div>';
  showPanel('Карта',h,(a,v)=>{ if(a==='wp'){ const p=POIS[+v]; setWp(p.x,p.z,p.n); sys('Метка на карте: '+p.n); closePanel(); } });
  const cvs=$q('#bigmap'), g=cvs.getContext('2d'), sc=340/720, tx=x=>(x+360)*sc, tz=z=>(z+360)*sc;
  g.fillStyle='#5d9a48'; g.fillRect(0,0,340,340); g.strokeStyle='#45474b'; g.lineWidth=5;
  RX.forEach(x=>{ g.beginPath(); g.moveTo(tx(x),0); g.lineTo(tx(x),340); g.stroke(); }); RZ.forEach(z=>{ g.beginPath(); g.moveTo(0,tz(z)); g.lineTo(340,tz(z)); g.stroke(); });
  g.font='bold 11px Arial'; g.textAlign='center'; g.textBaseline='middle';
  POIS.forEach(p=>{ g.fillStyle=p.c; g.beginPath(); g.arc(tx(p.x),tz(p.z),7,0,7); g.fill(); g.fillStyle='#fff'; g.fillText(p.k,tx(p.x),tz(p.z)+1); });
  if(wp){ g.fillStyle='#ffe14a'; g.beginPath(); g.arc(tx(wp.x),tz(wp.z),6,0,7); g.fill(); }
  g.fillStyle='#2a7bff'; g.strokeStyle='#fff'; g.lineWidth=2; g.beginPath(); g.arc(tx(px),tz(pz),6,0,7); g.fill(); g.stroke();
}

/* ---------- парковка / мои машины / сравнение ---------- */
const ownedV={};    // carId -> vehicle
function ownedInfo(c){ const d=CARS[c.m]; return {c:c,d:d,v:ownedV[c.id]}; }
function openParking(ax,az){
  const draw=()=>{
    if(!S.cars.length){ showPanel('Мои машины','<div class="card"><p>У вас нет машин. Купите в автосалоне.</p></div>',null); return; }
    const rows=S.cars.map(ownedInfo);
    const best=(f,hi)=>{ const vals=rows.map(f); return hi?Math.max.apply(null,vals):Math.min.apply(null,vals); };
    const bS=best(r=>r.d.maxV,true), bA=best(r=>r.d.acc,true), bF=best(r=>r.d.cap,true), bC=best(r=>r.d.cons,false);
    let h='<div class="card"><small>Сравнение купленных машин</small><table class="cmp"><tr><th></th><th>Макс.</th><th>Разгон</th><th>Бак</th><th>Расход</th></tr>';
    rows.forEach(r=>{ const cl=(x,b)=>x===b?' class="best"':''; h+='<tr><td><span class="dot" style="background:#'+('000000'+r.c.c.toString(16)).slice(-6)+'"></span>'+r.d.n+'</td><td'+cl(r.d.maxV,bS)+'>'+Math.round(r.d.maxV*3.6)+' км/ч</td><td'+cl(r.d.acc,bA)+'>'+r.d.acc.toFixed(1)+'</td><td'+cl(r.d.cap,bF)+'>'+r.d.cap+' л</td><td'+cl(r.d.cons,bC)+'>'+(r.d.cons*1000).toFixed(0)+' л/км</td></tr>'; });
    h+='</table><small>Зелёным — лучшее значение</small></div>';
    rows.forEach(r=>{ const fu=r.v?r.v.fuel:r.c.fuel; h+='<div class="card"><b>'+r.d.n+'</b> · топливо '+Math.round(fu)+'/'+r.d.cap+' л'+(ax!==null?'<div class="grid2">'+B('Пригнать сюда','call',r.c.id,'green')+(r.v?B('📍 Найти','find',r.c.id):'<span></span>')+'</div>':(r.v?B('📍 Найти','find',r.c.id):''))+'</div>'; });
    if(ax===null) h+='<small>Чтобы пригнать машину, подойдите к паркомату (P).</small>';
    showPanel(ax===null?'Мои машины':'Паркомат',h,(a,v)=>{
      const id=+v; const c=S.cars.find(x=>x.id===id); if(!c) return;
      if(a==='find'){ const vv=ownedV[id]; if(vv){ setWp(vv.x,vv.z,CARS[c.m].n); toast('Метка на машине'); closePanel(); } }
      if(a==='call'){
        let vv=ownedV[id];
        if(vv===veh){ toast('Вы уже в этой машине'); return; }
        const fs=freeSpot(ax,az,4.5,1.6), nx=fs[0], nz=fs[1];
        if(vv){ vv.x=nx; vv.z=nz; vv.h=Math.atan2(ax-nx,az-nz)+Math.PI/2; vv.trH=vv.h; vv.v=0; }
        else { ownedV[id]=spawnVeh(c.m,c.c,nx,nz,Math.PI/2,{fuel:c.fuel,carId:id,owner:1}); }
        toast('Машина «'+CARS[c.m].n+'» подана'); closePanel();
      }
    });
  };
  draw();
}

/* ---------- автосалон ---------- */
function freeSlot(){ for(const s of dealerSlots){ let free=true; for(const v of vehicles){ if(Math.hypot(v.x-s[0],v.z-s[1])<3.5){ free=false; break; } } if(free) return s; } return dealerSlots[0]; }
function openDealer(){
  const sel={}; SALE.forEach(m=>sel[m]=PAL[0]);
  const draw=()=>{
    let h='<div class="card">Наличные: <b>'+rub(S.cash)+'</b> · в гараже: '+S.cars.length+'/5</div>';
    SALE.forEach(m=>{ const d=CARS[m]; h+='<div class="card"><b>'+d.n+'</b> · '+rub(d.price)+'<small><br>'+d.d+'</small>'+bars(d)+'<div class="sw">'+PAL.map(c=>'<span class="swc'+(sel[m]===c?' on':'')+'" data-a="col" data-v="'+m+'|'+c+'" style="background:#'+('000000'+c.toString(16)).slice(-6)+'"></span>').join('')+'</div>'+B('Купить','buy',m,'green')+'</div>'; });
    if(S.cars.length){ h+='<div class="card"><b>Продать машину (60%)</b>'; S.cars.forEach(c=>{ h+='<div class="row"><span>'+CARS[c.m].n+'</span>'+B(rub(CARS[c.m].price*.6),'sell',c.id)+'</div>'; }); h+='</div>'; }
    const sc=pbody.scrollTop;
    showPanel('Автосалон',h,(a,v)=>{
      if(a==='col'){ const p=v.split('|'); sel[p[0]]=+p[1]; draw(); }
      if(a==='buy'){
        if(needPass()) return; if(S.cars.length>=5){ toast('Гараж полон (5 машин)'); return; }
        const d=CARS[v]; if(!spend(d.price)) return;
        const c={id:S.nid++,m:v,c:sel[v],fuel:d.cap*.5}; S.cars.push(c); const s=freeSlot();
        ownedV[c.id]=spawnVeh(v,c.c,s[0],s[1],s[2],{fuel:c.fuel,carId:c.id,owner:1});
        sys('Куплена машина: '+d.n+'. Она ждёт на парковке у салона.'); save(); draw();
      }
      if(a==='sell'){
        const i=S.cars.findIndex(c=>c.id===+v); if(i<0) return; const c=S.cars[i]; const vv=ownedV[c.id];
        if(vv&&vv===veh){ toast('Сначала выйдите из машины'); return; }
        if(vv){ removeVeh(vv); delete ownedV[c.id]; } S.cars.splice(i,1); pay(CARS[c.m].price*.6,'продажа '+CARS[c.m].n); draw();
      }
    });
    pbody.scrollTop=sc;
  };
  draw();
}
function bars(d){ const b=(n,v,mx)=>'<div class="bar"><i style="width:'+Math.round(clamp(v/mx,0,1)*100)+'%"></i><span>'+n+'</span></div>'; return b('Скорость',d.maxV,54)+b('Разгон',d.acc,15)+b('Бак',d.cap,100); }

/* ---------- заправка ---------- */
function refuel(){
  if(!veh||riding){ return; }
  const need=veh.d.cap-veh.fuel; if(need<0.5){ toast('Бак уже полный'); return; }
  if(Math.abs(veh.v)>3){ toast('Остановитесь для заправки'); return; }
  const price=55; const can=Math.min(need,Math.floor(S.cash/price));
  if(can<=0){ toast('Не хватает денег на бензин ('+price+' ₽/л)'); return; }
  S.cash-=can*price; veh.fuel+=can; if(veh.carId){ const c=S.cars.find(x=>x.id===veh.carId); if(c) c.fuel=veh.fuel; }
  toast('Заправлено '+Math.round(can)+' л за '+rub(can*price)); save();
}

/* ---------- аренда мопедов ---------- */
function freeSpot(x,z,d,r){ for(let i=0;i<20;i++){ const a=rnd(0,Math.PI*2), dd=d+(i>10?2:0); const nx=x+Math.sin(a)*dd, nz=z+Math.cos(a)*dd; if(!hit(nx,nz,r,0)&&!vehBlock(nx,nz,r,null)) return [nx,nz,a]; } return [x,z+d+3,0]; }
function rentMoped(x,z){
  if(S.cash<50){ sys('Аренда мопеда — 50 ₽. Не хватает денег.'); return; }
  for(const v of vehicles){ if(v.rentEnd&&v.rentEnd>tAll){ toast('У вас уже есть арендованный мопед'); return; } }
  S.cash-=50;
  const fs=freeSpot(x,z,3.2,.9), mx=fs[0], mz=fs[1], ang=fs[2];
  const v=spawnVeh('moped',pick([0xe0a81c,0x2e7d32,0x1f4e9c,0xc4121c]),mx,mz,ang,{});
  v.rentEnd=tAll+300; v.warned=false; sys('Мопед арендован на 5 минут (−50 ₽). Он рядом.'); save();
}
function removeVeh(v){
  const i=vehicles.indexOf(v); if(i>=0) vehicles.splice(i,1);
  const k=culls.indexOf(v.cull); if(k>=0) culls.splice(k,1);
  scene.remove(v.p.root);
}

/* ---------- казино ---------- */
function openCasino(){
  showPanel('Казино 777','<div class="card"><p>Наличные: <b>'+rub(S.cash)+'</b></p></div><div class="grid">'+B('🎰 Слоты','slots')+B('🎡 Рулетка','roul')+B('🎲 Кости','dice')+'</div>',(a)=>{ if(a==='slots') gSlots(); if(a==='roul') gRoulette(); if(a==='dice') gDice(); });
}
const BETS=[100,500,1000,5000];
function betRow(cur){ return '<div class="chrow">'+BETS.map(b=>B(String(b),'bet',b,cur===b?'on':'')).join('')+'</div>'; }
function gSlots(){
  let bet=100, busy=false; const SYM=['🍒','🍋','🔔','⭐','7️⃣','💎']; const MUL=[4,4,6,10,30,15];
  const draw=(r,msg)=>{
    showPanel('Слоты','<div class="card"><p>Наличные: <b>'+rub(S.cash)+'</b></p></div><div class="reels">'+r.map(s=>'<span>'+s+'</span>').join('')+'</div><p class="msg">'+(msg||'Сделайте ставку')+'</p>'+betRow(bet)+B('Крутить','spin','','green')+B('← Назад','back'),handle);
  };
  const handle=(a,v)=>{
    if(busy) return;
    if(a==='back') return openCasino();
    if(a==='bet'){ bet=+v; return draw(['🍒','🍋','🔔']); }
    if(a==='spin'){
      if(S.cash<bet){ toast('Не хватает денег'); return; } S.cash-=bet; busy=true; let n=0;
      const t=setInterval(()=>{ n++; const r=[pick(SYM),pick(SYM),pick(SYM)]; const rs=pbody.querySelectorAll('.reels span'); rs.forEach((e,i)=>e.textContent=r[i]);
        if(n>=14){ clearInterval(t); busy=false;
          const idx=[0,0,0].map(()=> (Math.random()*6)|0); const fin=idx.map(i=>SYM[i]); let win=0,msg='Не повезло';
          if(idx[0]===idx[1]&&idx[1]===idx[2]){ win=bet*MUL[idx[0]]; msg='ДЖЕКПОТ! ×'+MUL[idx[0]]; }
          else if(idx[0]===idx[1]||idx[1]===idx[2]||idx[0]===idx[2]){ win=Math.round(bet*1.2); msg='Пара: ×1.2'; }
          if(win>0) S.cash+=win; save(); draw(fin,msg+(win?' · +'+rub(win):'')); } },90);
      ui.timers.push(t);
    }
  };
  draw(['🍒','🍋','🔔']);
}
function gRoulette(){
  let bet=100, busy=false; const RED=[1,3,5,7,9,12,14,16,18,19,21,23,25,27,30,32,34,36];
  const draw=(num,msg)=>{
    const col=num===null?'#333':(num===0?'#1e8f3a':(RED.includes(num)?'#c4121c':'#111'));
    showPanel('Рулетка','<div class="card"><p>Наличные: <b>'+rub(S.cash)+'</b></p></div><div class="ball" style="background:'+col+'">'+(num===null?'?':num)+'</div><p class="msg">'+(msg||'Ставка на:')+'</p>'+betRow(bet)+'<div class="grid">'+B('Красное ×2','r','red','red')+B('Чёрное ×2','r','black')+B('Зеро ×36','r','zero','green')+B('Чёт ×2','r','even')+B('Нечёт ×2','r','odd')+'</div>'+B('← Назад','back'),handle);
  };
  const handle=(a,v)=>{
    if(busy) return;
    if(a==='back') return openCasino();
    if(a==='bet'){ bet=+v; return draw(null); }
    if(a==='r'){
      if(S.cash<bet){ toast('Не хватает денег'); return; } S.cash-=bet; busy=true; let n=0;
      const t=setInterval(()=>{ n++; const el=$q('.ball'); if(el) el.textContent=(Math.random()*37)|0;
        if(n>=16){ clearInterval(t); busy=false; const num=(Math.random()*37)|0; let win=0;
          if(v==='zero'&&num===0) win=bet*36; else if(num>0){ if(v==='red'&&RED.includes(num)) win=bet*2; if(v==='black'&&!RED.includes(num)) win=bet*2; if(v==='even'&&num%2===0) win=bet*2; if(v==='odd'&&num%2===1) win=bet*2; }
          if(win) S.cash+=win; save(); draw(num,(win?'Выигрыш! +'+rub(win):'Проигрыш')); } },90);
      ui.timers.push(t);
    }
  };
  draw(null);
}
function gDice(){
  let bet=100, busy=false;
  const draw=(d,msg)=>{
    showPanel('Кости','<div class="card"><p>Наличные: <b>'+rub(S.cash)+'</b></p></div><div class="reels dice"><span>'+d[0]+'</span><span>'+d[1]+'</span></div><p class="msg">'+(msg||'Сумма двух костей:')+'</p>'+betRow(bet)+'<div class="grid">'+B('Меньше 7 ×2.2','r','lo')+B('Ровно 7 ×5','r','se','green')+B('Больше 7 ×2.2','r','hi')+'</div>'+B('← Назад','back'),handle);
  };
  const handle=(a,v)=>{
    if(busy) return;
    if(a==='back') return openCasino();
    if(a==='bet'){ bet=+v; return draw(['⚀','⚁']); }
    if(a==='r'){
      if(S.cash<bet){ toast('Не хватает денег'); return; } S.cash-=bet; busy=true; let n=0; const F=['⚀','⚁','⚂','⚃','⚄','⚅'];
      const t=setInterval(()=>{ n++; const rs=pbody.querySelectorAll('.reels span'); rs.forEach(e=>e.textContent=pick(F));
        if(n>=12){ clearInterval(t); busy=false; const a1=(Math.random()*6)|0, b1=(Math.random()*6)|0, sum=a1+b1+2; let win=0;
          if(v==='lo'&&sum<7) win=Math.round(bet*2.2); if(v==='hi'&&sum>7) win=Math.round(bet*2.2); if(v==='se'&&sum===7) win=bet*5;
          if(win) S.cash+=win; save(); draw([F[a1],F[b1]],'Сумма '+sum+' · '+(win?'+'+rub(win):'проигрыш')); } },90);
      ui.timers.push(t);
    }
  };
  draw(['⚀','⚁']);
}

function updateCall(dt){

      const nx=n.x+dx*sp*dt, nz=n.z+dz*sp*dt; if(!hit(nx,n.z,.5)) n.x=nx; else n.z+=Math.sign(dz||1)*sp*dt; if(!hit(n.x,nz,.5)) n.z=nz; else n.x+=Math.sign(dx||1)*sp*dt;

function nearestVeh(){ let best=null,bd=1e9; for(let i=0;i<vehicles.length;i++){ const v=vehicles[i]; if(!v.drive) continue; const d=Math.hypot(P.x-v.x,P.z-v.z); if(d<v.enterR&&d<bd){bd=d;best=v;} } return best; }
function enterVeh(v){
  if(v.d.job&&S.job!==v.d.job){ toast('Транспорт для работы: '+JOBS[v.d.job].n); return; }
  if(JR.carry){ toast('Сначала отдайте коробку'); return; }
  veh=v; camPitch=.26; camYaw=v.h; P.speed=0; sigState=0; blinkOn=false; blinkT=0;
  if(v.kind==='moped'){ plCull.hide=false; pl.root.visible=true; } else { plCull.hide=true; pl.root.visible=false; }
}
function resetPose(){ pl.root.rotation.z=0; pl.body.position.y=0; pl.body.rotation.x=0; pl.lL.p.rotation.x=0; pl.lR.p.rotation.x=0; pl.lL.kn.rotation.x=0; pl.lR.kn.rotation.x=0; }
function exitVeh(force){
  if(!veh) return; if(riding){ if(!force&&Math.abs(veh.v)>4){ toast('Дождитесь остановки'); return; } forceExitPassenger(); return; } if(!force&&Math.abs(veh.v)>3){ toast('Остановитесь, чтобы выйти'); return; }
  const v=veh; const off=v.kind==='moped'?1.6:v.kind==='car'?2.3*(v.d.scale||1):3.6;
  const lx=Math.cos(v.h), lz=-Math.sin(v.h); let sx=v.x+lx*off, sz=v.z+lz*off;
  if(hit(sx,sz,.4,0)){ sx=v.x-lx*off; sz=v.z-lz*off; if(hit(sx,sz,.4,0)){ sx=v.x; sz=v.z; } }
  P.x=sx; P.z=sz; P.h=v.h; P.y=0; P.vy=0; veh=null; plCull.hide=false; pl.root.visible=true; resetPose();
  v.v=0; v.siren=false; sigState=0; blinkOn=false; setLights(v,0,false,false); applyVeh(v,0);
  if(v.carId){ const c=S.cars.find(x=>x.id===v.carId); if(c) c.fuel=v.fuel; save(); }
}
function toggleVeh(){ if(veh){ exitVeh(false); return; } const v=nearestVeh(), g=nearestGhost(); if(g&&(!v||Math.hypot(P.x-g.x,P.z-g.z)<=Math.hypot(P.x-v.x,P.z-v.z))){ boardGhost(g); return; } if(v) enterVeh(v); }

/* ---------- физика транспорта ---------- */
function driveVeh(v,dt){
  const thr=joy.y, prev=v.v, fuelOk=v.fuel>0; let a=0; v.braking=false; v.rev=false;
  if(thr>.1&&(fuelOk||v.v<-.3)){ if(v.v<-.3){ a=16; v.braking=true; } else a=v.acc*thr*(1-Math.max(0,v.v)/(v.maxV*1.02)); }
  else if(thr<-.1&&(v.v>.3||fuelOk)){ if(v.v>.3){ a=-18*(-thr); v.braking=true; } else a=-6*(-thr)*(1-Math.max(0,-v.v)/12); }
  else if(Math.abs(v.v)>.01) a=-Math.sign(v.v)*(2+Math.abs(v.v)*.07);
  v.v+=a*dt; if(Math.abs(thr)<=.1&&prev*v.v<0) v.v=0;
  v.v=clamp(v.v,-9,v.maxV); if(v.v<-.2) v.rev=true;
  const maxS=v.steer/(1+Math.abs(v.v)*.06), target=-(Math.abs(joy.x)<.06?0:joy.x)*maxS;
  v.sa+=(target-v.sa)*(1-Math.exp(-7*dt));
  const yaw=v.v/v.L*Math.tan(v.sa);
  const oh=v.h, ox=v.x, oz=v.z, oth=v.trH;
  v.h+=yaw*dt; v.x+=Math.sin(v.h)*v.v*dt; v.z+=Math.cos(v.h)*v.v*dt;
  if(v.kind==='semi'){ v.trH+=(v.v/7.5)*Math.sin(v.h-v.trH)*dt; const rel=angDiff(v.h,v.trH); if(Math.abs(rel)>1.3) v.trH=v.h+Math.sign(rel)*1.3; } else v.trH=v.h;
  const pts=vehPts(v); let crash=false;
  for(let i=0;i<pts.length&&!crash;i++){ if(hit(pts[i][0],pts[i][1],v.r,0)) crash=true; }
  if(!crash&&vehHit(v,pts)) crash=true;
  if(crash){ v.h=oh; v.x=ox; v.z=oz; v.trH=oth; if(Math.abs(v.v)>4&&v.kind==='semi'&&JR.contract&&tAll-(v.crashT||0)>1.2){ JR.contract.crash++; v.crashT=tAll; toast('Удар! Оплата рейса снижена'); } v.v*=-.25; }
  const lean=v.kind==='moped'?.012:.0035, lm=v.kind==='moped'?.35:.05;
  const acc=(v.v-prev)/Math.max(dt,.001);
  v.pitch+=(clamp(-acc*.0022,-.035,.045)-v.pitch)*(1-Math.exp(-6*dt));
  v.roll+=(clamp(v.v*yaw*lean,-lm,lm)-v.roll)*(1-Math.exp(-6*dt));
  const burn=Math.abs(v.v)*v.d.cons*dt+.0004*dt;
  const f0=v.fuel; v.fuel=Math.max(0,v.fuel-burn);
  if(v.fuel<=0&&f0>0) sys('Бензин кончился! Нужна заправка.'); else if(v.fuel<v.d.cap*.15&&f0>=v.d.cap*.15) toast('Мало топлива — ищите заправку (⛽ на карте)');
  if(look.id===null) camYaw+=angDiff(camYaw,v.h)*(1-Math.exp(-2.2*dt));
}
function poseRider(v,m){ m=m||pl;
  const sx=Math.sin(v.h), cz=Math.cos(v.h);
  m.root.position.set(v.x-sx*.4,.1,v.z-cz*.4); m.root.rotation.y=v.h; m.root.rotation.z=v.roll*.8;
  m.lL.p.rotation.x=-1.35; m.lR.p.rotation.x=-1.35; m.lL.kn.rotation.x=1.4; m.lR.kn.rotation.x=1.4;
  m.aL.p.rotation.x=-1.15; m.aR.p.rotation.x=-1.15; m.aL.el.rotation.x=-.3; m.aR.el.rotation.x=-.3; m.body.rotation.x=.12; m.body.position.y=0;
}

/* ---------- игрок пешком ---------- */
function updatePlayer(dt){
  const f={x:Math.sin(camYaw),z:Math.cos(camYaw)}, r={x:-Math.cos(camYaw),z:Math.sin(camYaw)};
  const mag=Math.min(1,Math.hypot(joy.x,joy.y));
  let mx=f.x*joy.y+r.x*joy.x, mz=f.z*joy.y+r.z*joy.x; const ml=Math.hypot(mx,mz); let sp=0;
  if(mag>.08&&ml>0){ mx/=ml; mz/=ml; sp=(mag>.85?6.4:4.2*mag/.85+.6); if(JR.carry) sp*=.75; const th=Math.atan2(mx,mz); P.h+=angDiff(P.h,th)*(1-Math.exp(-12*dt)); }
  P.speed+=(sp-P.speed)*(1-Math.exp(-10*dt));
  if(sp>0){
    const nx=P.x+mx*sp*dt, nz=P.z+mz*sp*dt;
    if(!hit(nx,P.z,.4,P.y)&&!vehBlock(nx,P.z,.4,null)) P.x=nx;
    if(!hit(P.x,nz,.4,P.y)&&!vehBlock(P.x,nz,.4,null)) P.z=nz;
  }
  if(jumpReq&&P.ground){ P.vy=7.2; P.ground=false; } jumpReq=false;
  if(!P.ground){ P.vy-=22*dt; P.y+=P.vy*dt; if(P.y<=0){ P.y=0; P.vy=0; P.ground=true; } }
  P.phase+=P.speed*dt*1.75;
  const k=Math.min(1,P.speed/5.5), sw=Math.sin(P.phase)*.8*k;
  pl.root.position.set(P.x,P.y,P.z); pl.root.rotation.y=P.h; pl.root.rotation.z=0;
  if(P.ground){
    pl.lL.p.rotation.x=-sw; pl.lR.p.rotation.x=sw;
    pl.lL.kn.rotation.x=Math.max(0,Math.sin(P.phase+1.3))*.95*k; pl.lR.kn.rotation.x=Math.max(0,Math.sin(P.phase+1.3+Math.PI))*.95*k;
    pl.aL.p.rotation.x=JR.carry?-.9:sw*.9; pl.aR.p.rotation.x=JR.carry?-.9:-sw*.9; pl.aL.el.rotation.x=JR.carry?-1.0:-(.15+.6*k); pl.aR.el.rotation.x=JR.carry?-1.0:-(.15+.6*k);
    pl.body.position.y=Math.sin(tAll*2)*.004*(1-k)+Math.abs(Math.sin(P.phase))*.045*k; pl.body.rotation.x=.12*k;
  } else {
    pl.lL.p.rotation.x=-.5; pl.lR.p.rotation.x=.35; pl.lL.kn.rotation.x=.9; pl.lR.kn.rotation.x=.4;
    pl.aL.p.rotation.x=-2.5; pl.aR.p.rotation.x=-2.5; pl.aL.el.rotation.x=-.2; pl.aR.el.rotation.x=-.2; pl.body.rotation.x=0;
  }
}

/* ---------- ближайшая точка действия ---------- */
function findSpot(){
  const px=veh?veh.x:P.x, pz=veh?veh.z:P.z; let best=null, bd=1e9;
  for(let i=0;i<spots.length;i++){
    const o=spots[i]; const en=o.en(); const d=Math.hypot(px-o.x,pz-o.z);
    o.g.visible=en&&d<130;
    if(!en){ o.in=false; continue; }
    const okMode=o.car?(!!veh&&!riding):!veh;
    if(!okMode){ o.in=false; continue; }
    if(d<o.r){
      if(o.auto){ if(!o.in){ o.in=true; o.use(o); } }
      else if(d<bd){ bd=d; best=o; }
    } else o.in=false;
  }
  return best;
}

/* ---------- мир ---------- */
function updateWorld(dt){
  const px=veh?veh.x:P.x, pz=veh?veh.z:P.z;
  updateNPCs(dt,px,pz);
  for(let i=0;i<ORE.length;i++){ const o=ORE[i]; if(!o.alive&&tAll>o.resp){ o.alive=true; o.mesh.visible=true; } }
  if(S.job==='police'&&JR.patrol){ if(JR.call) updateCall(dt); else { JR.callT-=dt; if(JR.callT<=0) newCall(); } }
  if(JR.course&&tAll-JR.course.t0>JR.course.limit){ JR.course=null; clearWp(); sys('Время вышло — полоса не пройдена'); }
  checkDelivery();
  vehicles.forEach(v=>{ if(v.home&&v!==veh){ if(Math.hypot(v.x-v.home[0],v.z-v.home[1])>12){ v.idle=(v.idle||0)+dt; if(v.idle>150){ v.x=v.home[0]; v.z=v.home[1]; v.h=v.home[2]; v.trH=v.h; v.v=0; v.idle=0; applyVeh(v,0); } } else v.idle=0; } });
  if(wp&&Math.hypot(px-wp.x,pz-wp.z)<7&&!JR.call&&!JR.course&&!JR.contract&&!(JR.order&&JR.order.carry)){ toast('Вы прибыли: '+wp.n); clearWp(); }
  vehicles.slice().forEach(v=>{ if(v.rentEnd){ const left=v.rentEnd-tAll; if(left<30&&!v.warned){ v.warned=true; toast('Аренда мопеда закончится через 30 сек'); } if(left<=0){ if(veh===v) exitVeh(true); removeVeh(v); toast('Аренда мопеда закончилась'); } } });
  botT-=dt; if(botT<=0){ botT=rnd(10,24); if(!MP.on) chat(pick(BOTS),pick(BOT_LINES)); }
  saveT+=dt; if(saveT>10){ saveT=0; S.cars.forEach(c=>{ const v=ownedV[c.id]; if(v) c.fuel=v.fuel; }); save(); }
}

/* ---------- камера ---------- */
function updateCamera(){
  const tx=veh?veh.x:P.x, tz=veh?veh.z:P.z, ty=veh?veh.camH:(1.55+P.y*.6), d=veh?veh.camD:4.3;
  const fx=Math.sin(camYaw), fz=Math.cos(camYaw), cp=Math.cos(camPitch), sp=Math.sin(camPitch);
  let ex=tx-fx*cp*d, ey=ty+sp*d, ez=tz-fz*cp*d;
  for(let i=1;i<=12;i++){ const t=i/12; if(hit(tx+(ex-tx)*t,tz+(ez-tz)*t,.3,3)){ const tt=Math.max(.12,(i-1)/12); ex=tx+(ex-tx)*tt; ey=ty+(ey-ty)*tt; ez=tz+(ez-tz)*tt; break; } }
  camera.position.set(ex,Math.max(ey,.4),ez); camera.lookAt(tx,ty+.05,tz);
  sky.position.copy(camera.position);
  sun.position.set(tx+35,55,tz+25); sun.target.position.set(tx,0,tz); sun.target.updateMatrixWorld();
  if(groundMesh){ groundMesh.position.x=Math.round(tx/9)*9; groundMesh.position.z=Math.round(tz/9)*9; }
}

const sigLe=$('sigL'), sigRe=$('sigR'); let frame=0, last=performance.now(), first=true;
function update(dt){
  if(!ui.open){
    tAll+=dt;
    if(veh){ if(!riding) driveVeh(veh,dt); } else updatePlayer(dt);
    updateWorld(dt);
    if(sigState!==0){ blinkT+=dt; if(blinkT>=.36){ blinkT=0; blinkOn=!blinkOn; if(veh) tick(); } }
  }
  if(veh&&!riding){ applyVeh(veh,ui.open?0:dt); setLights(veh,sigState,blinkOn,true); if(veh.kind==='moped') poseRider(veh); }
  mpUpdate(dt);
  const lit=!!veh&&blinkOn;
  sigLe.classList.toggle('on',lit&&sigState===1); sigRe.classList.toggle('on',lit&&sigState===-1);
  bL.classList.toggle('lit',!!veh&&sigState===1); bR.classList.toggle('lit',!!veh&&sigState===-1);

  setVis('gauge',gaugeEl,!!veh,'block'); setVis('sigrow',sigrow,!!veh,'flex'); setVis('jump',bJump,!veh,'flex');
  setVis('siren',bSiren,!!(veh&&!riding&&veh.p.mR&&S.job==='police'),'flex');
  curSpot=ui.open?null:findSpot();
  bAct.style.visibility=curSpot?'visible':'hidden'; if(curSpot) bAct.textContent=curSpot.act||curSpot.label||'Действие';
  const nv=veh?veh:(nearestVeh()||nearestGhost());
  if(veh){ bSit.textContent='Выйти'; bSit.classList.add('show'); } else { bSit.textContent='Сесть'; bSit.classList.toggle('show',!!nv); }
  plCull.hide=!!veh&&veh.kind!=='moped';
  updateCamera();
  if(veh) drawGauge(Math.abs(veh.v)*3.6,Math.round(veh.fuel/veh.d.cap*100));
  if((frame++&1)===0) drawMap();
  hudT-=dt; if(hudT<=0){ hudT=.2; updateHUD(); renderChat(); }
  if(toastT>0){ toastT-=dt; if(toastT<=0) toastEl.style.opacity=0; }
}
let fpsN=0, fpsT=0;
function loop(now){
  requestAnimationFrame(loop);
  const dt=Math.min(.05,(now-last)/1000); last=now;
  if(mode==='menu'){ const a=now*.00015; camera.position.set(5+Math.sin(a)*40,15,-5+Math.cos(a)*40); camera.lookAt(5,4,-8); sky.position.copy(camera.position); sun.position.set(45,55,25); sun.target.position.set(5,0,5); sun.target.updateMatrixWorld(); if(groundMesh) groundMesh.position.set(0,0,0); }
  else update(dt);

  if(first){ first=false; $('loading').style.display='none'; }
}

const MP={on:false,host:false,peer:null,conns:[],hc:null,code:'',id:0,name:'',nid:2,players:{},sendT:0,pax:{},leaving:false};
function loadPeerLib(ok,fail){
  if(window.Peer) return ok();
  const urls=['peerjs.min.js','https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js','https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js']; let i=0;
  (function next(){ if(i>=urls.length) return fail(); const s=document.createElement('script'); s.src=urls[i++]; s.onload=()=>{ if(window.Peer) ok(); else next(); }; s.onerror=()=>{ s.remove(); next(); }; document.head.appendChild(s); })();
}
function mpGenCode(){ const A='ABCDEFGHJKLMNPQRSTUVWXYZ23456789'; let s=''; for(let i=0;i<5;i++) s+=A[(Math.random()*A.length)|0]; return s; }
function mpSend(m){ if(!MP.on) return; if(MP.host){ relay(m,null); } else if(MP.hc&&MP.hc.open){ try{ MP.hc.send(m); }catch(e){} } }
function relay(m,except){ for(let i=0;i<MP.conns.length;i++){ const c=MP.conns[i]; if(c!==except&&c.open&&c.__id){ try{ c.send(m); }catch(e){} } } }

function mpRefresh(){ if(roomOpen&&ui.open) openRoom(); }

function hostRoom(){
  const tryCode=()=>{
    const code=mpGenCode(); let p;
    try{ p=new Peer('krmk-'+code,{debug:0}); }catch(e){ toast('Ошибка мультиплеера'); return; }
    p.on('open',()=>{ MP.peer=p; MP.on=true; MP.host=true; MP.id=1; MP.nid=2; MP.code=code; MP.players={}; MP.conns=[]; openRoom(); chat('','Комната создана. Код: '+code+'. Ваш ID: 1','sys'); });
    p.on('error',err=>{ if(err&&err.type==='unavailable-id'){ try{p.destroy();}catch(e){} tryCode(); } else { toast('Ошибка сети: '+(err&&err.type||'?'),4000); } });
    p.on('connection',conn=>{ MP.conns.push(conn); conn.on('data',m=>hostRecv(conn,m)); conn.on('close',()=>hostDrop(conn)); conn.on('error',()=>hostDrop(conn)); });
  };
  tryCode();
}
function hostRecv(conn,m){
  if(!m||typeof m!=='object') return;
  if(m.t==='hello'){
    if(conn.__id) return; conn.__id=MP.nid++; conn.__name=String(m.name||'Игрок').slice(0,16);
    const list=[{id:1,name:MP.name}].concat(MP.conns.filter(c=>c!==conn&&c.__id).map(c=>({id:c.__id,name:c.__name})));
    conn.send({t:'welcome',id:conn.__id,players:list,dead:ORE.map((o,i)=>o.alive?-1:i).filter(i=>i>=0),code:MP.code});
    relay({t:'join',id:conn.__id,name:conn.__name},conn); addRemote(conn.__id,conn.__name); sys(conn.__name+' [ID '+conn.__id+'] подключился'); mpRefresh(); return;
  }
  if(!conn.__id) return;
  m.from=conn.__id; handleMsg(m); relay(m,conn);
}
function hostDrop(conn){
  const i=MP.conns.indexOf(conn); if(i>=0) MP.conns.splice(i,1);
  if(conn.__id&&MP.players[conn.__id]){ const n=MP.players[conn.__id].name; removeRemote(conn.__id); relay({t:'left',id:conn.__id},null); sys(n+' вышел из игры'); mpRefresh(); }
}
function joinRoom(code){
  let done=false;
  const fail=(msg)=>{ if(done) return; done=true; toast(msg,4000); try{ if(MP.peer) MP.peer.destroy(); }catch(e){} MP.peer=null; };
  let p; try{ p=new Peer(undefined,{debug:0}); }catch(e){ fail('Ошибка мультиплеера'); return; }
  MP.peer=p;
  const to=setTimeout(()=>{ if(!MP.on) fail('Не удалось подключиться: комната не отвечает'); },15000);
  p.on('error',err=>{ clearTimeout(to); fail(err&&err.type==='peer-unavailable'?'Комната с таким кодом не найдена':'Ошибка сети: '+(err&&err.type||'?')); });
  p.on('open',()=>{
    const conn=p.connect('krmk-'+code,{reliable:true}); MP.hc=conn;
    conn.on('open',()=>{ conn.send({t:'hello',name:MP.name}); });
    conn.on('data',m=>clientRecv(m,code,to));
    conn.on('close',()=>{ if(MP.on&&!MP.leaving){ toast('Соединение с комнатой потеряно',4000); mpLeave(); } });
    conn.on('error',()=>{ clearTimeout(to); fail('Ошибка соединения'); });
  });
}
function clientRecv(m,code,to){
  if(!m||typeof m!=='object') return;
  if(m.t==='welcome'){
    clearTimeout(to); MP.on=true; MP.host=false; MP.id=m.id; MP.code=code; MP.players={};
    m.players.forEach(p=>{ if(p.id!==MP.id) addRemote(p.id,p.name); });
    (m.dead||[]).forEach(i=>setOre(i,false));
    startGame(); chat('','Вы в комнате '+code+'. Ваш ID: '+MP.id+'. Друзья: '+m.players.map(p=>p.name+' [ID '+p.id+']').join(', '),'sys'); toast('Подключено! Ваш ID: '+MP.id,3500); return;
  }
  handleMsg(m);
}
function handleMsg(m){
  switch(m.t){
    case 'join': addRemote(m.id,m.name); sys(m.name+' [ID '+m.id+'] подключился'); mpRefresh(); break;
    case 'left': { const r=MP.players[m.id]; if(r){ sys(r.name+' вышел из игры'); removeRemote(m.id); mpRefresh(); } break; }
    case 'st': onState(m); break;
    case 'chat': chat(m.n,m.m,m.c); break;
    case 'ore': setOre(m.i,!!m.a); break;
    case 'pay': if(m.to===MP.id){ S.cash+=m.amt; save(); sys('Вам перевели '+rub(m.amt)+' от '+m.name+' [ID '+m.from+']'); } break;
    case 'board': if(m.owner===MP.id){ if(m.on){ MP.pax[m.from]=m.name; sys(m.name+' сел пассажиром'); } else { delete MP.pax[m.from]; toast(m.name+' вышел из машины'); } } break;
  }
}
function setOre(i,alive){ const o=ORE[i]; if(!o) return; o.alive=alive; o.mesh.visible=alive; if(!alive) o.resp=tAll+30; }

/* --- удалённые игроки --- */
function addRemote(id,name){
  if(MP.players[id]) return;
  const m=makePlayer(); scene.add(m.root);
  const tag=labelSprite(name+' ['+id+']'); tag.scale.set(5.2,.98,1); tag.position.y=2.55; m.root.add(tag);
  const cull=reg(m.root,true); cull.hide=true;
  MP.players[id]={id:id,name:name,m:m,cull:cull,x:5,z:5,y:0,h:0,sp:0,aph:0,tx:5,tz:5,ty:0,th:0,got:false,v:null,ghost:null,rd:0};
}
function removeRemote(id){
  const r=MP.players[id]; if(!r) return;
  removeGhost(r); scene.remove(r.m.root); const k=culls.indexOf(r.cull); if(k>=0) culls.splice(k,1); delete MP.players[id];
}
function removeGhost(r){
  if(!r.ghost) return;
  if(veh===r.ghost&&riding) forceExitPassenger();
  removeVeh(r.ghost); r.ghost=null;
}
function onState(m){
  const r=MP.players[m.id]; if(!r) return;
  r.tx=m.x; r.tz=m.z; r.ty=m.y||0; r.th=m.h; r.sp=m.sp||0; r.rd=m.rd||0; r.v=m.v||null;
  if(!r.got){ r.got=true; r.x=m.x; r.z=m.z; r.h=m.h; }
  if(r.v){
    if(r.ghost&&r.ghost.model!==r.v.m){ removeGhost(r); }
    if(!r.ghost){ const g=spawnVeh(r.v.m,r.v.c,r.v.x,r.v.z,r.v.h,{drive:false}); g.remote=true; g.ownerId=r.id; g.x=r.v.x; g.z=r.v.z; g.h=r.v.h; r.ghost=g; }
  } else if(r.ghost){ removeGhost(r); }
}
function nearestGhost(){
  let best=null,bd=1e9;
  for(let i=0;i<vehicles.length;i++){ const v=vehicles[i]; if(!v.remote||v.kind==='moped') continue; const d=Math.hypot(P.x-v.x,P.z-v.z); if(d<v.enterR&&d<bd){ bd=d; best=v; } }
  return best;
}
function boardGhost(g){
  if(JR.carry){ toast('Сначала отдайте коробку'); return; }
  veh=g; riding=true; plCull.hide=true; pl.root.visible=false; camPitch=.26; camYaw=g.h;
  mpSend({t:'board',owner:g.ownerId,on:1,from:MP.id,name:MP.name}); toast('Вы сели пассажиром',2200);
}
function forceExitPassenger(){
  const g=veh; riding=false;
  if(g){ const lx=Math.cos(g.h), lz=-Math.sin(g.h); let sx=g.x+lx*2.6, sz=g.z+lz*2.6; if(hit(sx,sz,.4,0)){ sx=g.x-lx*2.6; sz=g.z-lz*2.6; } P.x=sx; P.z=sz; P.h=g.h; P.y=0; P.vy=0; mpSend({t:'board',owner:g.ownerId,on:0,from:MP.id,name:MP.name}); }
  veh=null; plCull.hide=false; pl.root.visible=true; resetPose();
}
function mpLeave(){
  if(!MP.on&&!MP.peer&&!MP.hc) return;
  MP.leaving=true;
  if(riding) forceExitPassenger();
  try{ if(MP.hc) MP.hc.close(); MP.conns.forEach(c=>{ try{c.close();}catch(e){} }); if(MP.peer) MP.peer.destroy(); }catch(e){}
  Object.keys(MP.players).forEach(id=>removeRemote(+id));
  MP.on=false; MP.host=false; MP.peer=null; MP.conns=[]; MP.hc=null; MP.players={}; MP.id=0; MP.pax={}; MP.leaving=false;
}
function animRemote(r,dt){
  r.aph+=r.sp*dt*1.75; const k=Math.min(1,r.sp/5.5), sw=Math.sin(r.aph)*.8*k, m=r.m;
  m.lL.p.rotation.x=-sw; m.lR.p.rotation.x=sw; m.lL.kn.rotation.x=Math.max(0,Math.sin(r.aph+1.3))*.95*k; m.lR.kn.rotation.x=Math.max(0,Math.sin(r.aph+1.3+Math.PI))*.95*k;
  m.aL.p.rotation.x=sw*.9; m.aR.p.rotation.x=-sw*.9; m.aL.el.rotation.x=-(.15+.6*k); m.aR.el.rotation.x=-(.15+.6*k); m.body.position.y=Math.abs(Math.sin(r.aph))*.045*k; m.body.rotation.x=.12*k;
}
function mpUpdate(dt){
  if(!MP.on) return;
  const a=1-Math.exp(-12*dt), on=Math.floor(performance.now()/350)%2===0;
  Object.keys(MP.players).forEach(k=>{
    const r=MP.players[k]; if(!r.got){ r.cull.hide=true; return; }
    r.x+=(r.tx-r.x)*a; r.z+=(r.tz-r.z)*a; r.y+=(r.ty-r.y)*a; r.h+=angDiff(r.h,r.th)*a;
    const inV=!!r.v||r.rd;
    if(r.v){
      const g=r.ghost, s=r.v;
      if(g){ g.x+=(s.x-g.x)*a; g.z+=(s.z-g.z)*a; g.h+=angDiff(g.h,s.h)*a; g.trH+=angDiff(g.trH,s.tr)*a; g.v=s.v; g.sa=s.sa; g.pitch=s.pi; g.roll=s.ro; g.braking=!!s.br; g.rev=!!s.rv; g.siren=!!s.si; applyVeh(g,dt); setLights(g,s.sg,on,true); }
    }
    if(r.v&&r.v.m==='moped'&&r.ghost){ r.m.root.visible=true; r.cull.hide=false; poseRider(r.ghost,r.m); }
    else if(inV){ r.cull.hide=true; }
    else { r.cull.hide=false; r.m.root.position.set(r.x,r.y,r.z); r.m.root.rotation.y=r.h; r.m.root.rotation.z=0; animRemote(r,dt); }
  });
  MP.sendT-=dt;
  if(MP.sendT<=0){
    MP.sendT=.1;
    const s={t:'st',id:MP.id,x:P.x,z:P.z,y:P.y,h:P.h,sp:P.speed,rd:(riding&&veh)?veh.ownerId:0};
    if(veh&&!riding){ s.v={m:veh.model,c:veh.color,x:veh.x,z:veh.z,h:veh.h,v:veh.v,sa:veh.sa,pi:veh.pitch,ro:veh.roll,tr:veh.trH,sg:blinkOn?sigState:0,br:veh.braking?1:0,rv:veh.rev?1:0,si:veh.siren?1:0}; s.x=veh.x; s.z=veh.z; s.h=veh.h; }
    if(riding&&veh){ s.x=veh.x; s.z=veh.z; }
    mpSend(s);
  }
}
